<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7f4">
    <title translate="no">Ollama Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/workspace.css">
    <link rel="stylesheet" href="/static/css/translation.css">
    <link rel="stylesheet" href="/static/css/previews.css">
    <link rel="stylesheet" href="/static/css/notes.css">
    <link rel="stylesheet" href="/static/css/history.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- Icon sprite — every symbol is a 20x20 stroked path on currentColor. -->
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
        <symbol id="i-text" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 5h14M3 9h14M3 13h9"/>
        </symbol>
        <symbol id="i-doc" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 2.5h11v15h-11z"/>
            <path d="M7.5 7h5M7.5 10h5M7.5 13h3"/>
        </symbol>
        <symbol id="i-note" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 2.5h7.5L16 6v11.5H5z"/>
            <path d="M12.5 2.5V6H16"/>
            <path d="M7.5 10h5M7.5 13h3.5"/>
        </symbol>
        <symbol id="i-search" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8.75" cy="8.75" r="5.25"/>
            <path d="M12.8 12.8 17 17"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="7"/>
            <path d="M10 5.5V10l3.2 1.9"/>
        </symbol>
        <symbol id="i-sparkle" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2.5c.8 3.9 2.1 5.2 6 6-3.9.8-5.2 2.1-6 6-.8-3.9-2.1-5.2-6-6 3.9-.8 5.2-2.1 6-6z"/>
        </symbol>
        <symbol id="i-copy" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="7" width="9.5" height="9.5" rx="1.5"/>
            <path d="M13 4.5H4.5A1.5 1.5 0 0 0 3 6v8.5"/>
        </symbol>
        <symbol id="i-download" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3v8.5"/>
            <path d="M6.5 8 10 11.5 13.5 8"/>
            <path d="M3.5 14.5v1a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-1"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 5.5h13"/>
            <path d="M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5"/>
            <path d="M5 5.5 5.8 16a1 1 0 0 0 1 1h6.4a1 1 0 0 0 1-1L15 5.5"/>
            <path d="M8.5 9v4M11.5 9v4"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10.5 8 14.5 16 6"/>
        </symbol>
        <symbol id="i-chevron-left" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4.5 6.5 10 12 15.5"/>
        </symbol>
        <symbol id="i-chevron-right" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 4.5 13.5 10 8 15.5"/>
        </symbol>
        <symbol id="i-chevron-down" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 8 10 13.5 15.5 8"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 4v12M4 10h12"/>
        </symbol>
        <symbol id="i-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="3.5"/>
            <path d="M10 1.8v1.9M10 16.3v1.9M1.8 10h1.9M16.3 10h1.9"/>
            <path d="M4.4 4.4 5.7 5.7M14.3 14.3l1.3 1.3M15.6 4.4l-1.3 1.3M5.7 14.3l-1.3 1.3"/>
        </symbol>
        <symbol id="i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9z"/>
        </symbol>
        <symbol id="i-panel" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2"/>
            <path d="M12 3.5v13"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 5l10 10M15 5 5 15"/>
        </symbol>
        <symbol id="i-upload" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3v9"/>
            <path d="M6.5 6.5 10 3l3.5 3.5"/>
            <path d="M3.5 14.5v1a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-1"/>
        </symbol>
        <symbol id="i-zoom-in" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8.5" cy="8.5" r="5"/>
            <path d="M12.2 12.2 16.5 16.5"/>
            <path d="M8.5 5.8v5.4M5.8 8.5h5.4"/>
        </symbol>
        <symbol id="i-zoom-out" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8.5" cy="8.5" r="5"/>
            <path d="M12.2 12.2 16.5 16.5"/>
            <path d="M5.8 8.5h5.4"/>
        </symbol>
        <symbol id="i-fit" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.5 3.5H5A1.5 1.5 0 0 0 3.5 5v2.5"/>
            <path d="M12.5 3.5H15A1.5 1.5 0 0 1 16.5 5v2.5"/>
            <path d="M7.5 16.5H5a1.5 1.5 0 0 1-1.5-1.5V12.5"/>
            <path d="M12.5 16.5H15a1.5 1.5 0 0 0 1.5-1.5V12.5"/>
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.5 8.5A6.5 6.5 0 1 0 15 14.5"/>
            <path d="M16.5 3.5v5h-5"/>
        </symbol>
        <symbol id="i-menu" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 5.5h14M3 10h14M3 14.5h14"/>
        </symbol>
        <symbol id="i-file" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 2.5h6.5L16 7v10.5H5z"/>
            <path d="M11.5 2.5V7H16"/>
        </symbol>
        <symbol id="i-warning" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3 18 16.5H2z"/>
            <path d="M10 8v3.6"/>
            <path d="M10 13.9v.1"/>
        </symbol>
        <symbol id="i-arrow-right" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 10h13"/>
            <path d="M11.5 5 16.5 10l-5 5"/>
        </symbol>
        <symbol id="i-arrow-swap" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7.5h12"/>
            <path d="M12.5 4 16 7.5 12.5 11"/>
            <path d="M16 12.5H4"/>
            <path d="M7.5 9 4 12.5 7.5 16"/>
        </symbol>
        <symbol id="i-info" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="7.25"/>
            <path d="M10 9.2v4.4"/>
            <path d="M10 6.3v.1"/>
        </symbol>
    </svg>

    {% block content %}{% endblock %}

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="/static/js/translation.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/resize.js"></script>
    <script src="/static/js/notes.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/history.js"></script>
</body>
</html>
