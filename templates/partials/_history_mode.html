<!-- Tab panel: History workspace (list / stats) -->
<section id="panelHistory" class="tab-panel" role="tabpanel" aria-labelledby="tabHistory" tabindex="0">
    <div class="history-layout">
        <div class="panel history-panel" id="historyPanel">
            <div class="panel__header">
                <div>
                    <p class="eyebrow">History</p>
                    <h2 class="panel__title">Translation history</h2>
                </div>
                <div class="history-toolbar">
                    <div class="segmented" role="group" aria-label="History view">
                        <button type="button" id="historyViewList" class="segmented__item is-active" aria-pressed="true">List</button>
                        <button type="button" id="historyViewStats" class="segmented__item" aria-pressed="false">Stats</button>
                    </div>
                    <button type="button" id="clearHistoryBtn" class="btn btn--ghost btn--sm btn--danger">
                        <svg class="btn__icon" aria-hidden="true"><use href="#i-trash"></use></svg>
                        <span class="btn__label">Clear all</span>
                    </button>
                </div>
            </div>

            <div class="panel__body history-search">
                <input type="search" id="historySearchInput" class="input" placeholder="Search translations…" aria-label="Search translation history" autocomplete="off">
            </div>

            <!-- List view -->
            <div id="historyListView" class="history-view">
                <div id="historyList" class="history-list" role="list">
                    <div class="empty-state">
                        <svg class="icon empty-state__icon" aria-hidden="true"><use href="#i-clock"></use></svg>
                        <p class="empty-state__title">No translation history yet</p>
                        <p class="empty-state__text">Your translations will appear here automatically.</p>
                    </div>
                </div>
            </div>

            <!-- Stats view -->
            <div id="historyStatsView" class="history-view" hidden>
                <div id="historyStats" class="history-stats"></div>
            </div>
        </div>
    </div>
</section>
