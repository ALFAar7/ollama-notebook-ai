<!-- Tab panel: Text workspace (two-column source / translation split) -->
<section id="panelText" class="tab-panel" role="tabpanel" aria-labelledby="tabText" tabindex="0">
    <div class="workspace-split">

        <!-- Source column -->
        <article class="panel panel-source">
            <div class="panel__header">
                <div>
                    <p class="eyebrow">Source</p>
                    <h2 class="panel__title">Original text</h2>
                </div>
                <button type="button" id="clearTextBtn" class="icon-btn" aria-label="Clear text" title="Clear text">
                    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
                </button>
            </div>

            <div class="panel__body">
                <label for="textInput" class="sr-only">Source text</label>
                <textarea id="textInput" class="textarea" placeholder="Paste a passage, article section, or research note here…" aria-describedby="textInputHint"></textarea>
                <p id="textInputHint" class="hint">Press Ctrl + Enter to translate.</p>
            </div>

            <div class="panel__footer source-footer">
                <div class="source-meta">
                    <span id="charCount" class="hint">0 characters</span>
                    <span id="wordCount" class="hint">0 words</span>
                </div>
                <div class="translate-actions">
                    <button type="button" id="copySourceBtn" class="btn btn--ghost btn--sm">
                        <svg class="icon btn__icon" aria-hidden="true"><use href="#i-copy"></use></svg>
                        <span class="btn__label">Copy source</span>
                    </button>
                    <button type="button" id="translateTextBtn" class="btn btn--primary btn--md">
                        <svg class="icon btn__icon" aria-hidden="true"><use href="#i-sparkle"></use></svg>
                        <span class="btn__label">Translate</span>
                        <span class="kbd">Ctrl ↵</span>
                    </button>
                </div>
            </div>
        </article>

        <!-- Splitter between the two columns -->
        <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the source and translation columns" tabindex="0"></div>

        <!-- Output column -->
        <article class="panel panel-output">
            <div class="panel__header">
                <div>
                    <p class="eyebrow">Translation</p>
                    <h2 class="panel__title">Translated output</h2>
                </div>
                <div class="output-actions">
                    <button type="button" id="copyTranslationBtnText" class="btn btn--ghost btn--sm" disabled>
                        <svg class="icon btn__icon" aria-hidden="true"><use href="#i-copy"></use></svg>
                        <span class="btn__label">Copy</span>
                    </button>
                    <button type="button" id="downloadTranslationBtnText" class="btn btn--ghost btn--sm" disabled>
                        <svg class="icon btn__icon" aria-hidden="true"><use href="#i-download"></use></svg>
                        <span class="btn__label">Download .txt</span>
                    </button>
                    <button type="button" id="retryTranslationBtnText" class="btn btn--ghost btn--sm" disabled>
                        <svg class="icon btn__icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
                        <span class="btn__label">Retry</span>
                    </button>
                </div>
            </div>

            <div id="translationAreaText" class="panel__body output-body" aria-live="polite">
                <div class="empty-state">
                    <svg class="icon empty-state__icon" aria-hidden="true"><use href="#i-sparkle"></use></svg>
                    <p class="empty-state__title">Your translation will appear here</p>
                    <p class="empty-state__text">Paste text and click Translate to begin.</p>
                </div>
            </div>

            <div class="panel__footer">
                <span id="textModeLoading" class="badge badge--brand hidden" aria-live="polite">
                    <span class="spinner" aria-hidden="true"></span>Translating…
                </span>
            </div>
        </article>

    </div>
</section>
